answer_block: "Jin-Ho Lee is a data scientist with bioinformatics roots based in Mannheim, Germany. He spent eight years in academic research across bioinformatics and experimental biophysics with 11 peer-reviewed publications, and now ships production machine-learning and data pipelines, brings Google Cloud consulting experience from international banking, and has coached 100+ specialists in Python, SQL and ML. He holds an M.Sc. from Heidelberg University."
tagline: "Data scientist with bioinformatics roots — eight years of academic research, 11 peer-reviewed publications, production ML and cloud consulting on GCP; 1,000+ analytical processes migrated, 100+ specialists coached."
paragraphs:
  - "Worked across bioinformatics and experimental biophysics: unpublished NGS/RNA-Seq genomics project work (HLA typing and splice-derived neoepitope candidate pipelines) at the National Center for Tumor Diseases (NCT) and Seoul National University (SNU), plus quantitative bioimage analysis and wet-lab research at the German Cancer Research Center (DKFZ), Forschungszentrum Jülich (FZ Jülich), and Kirchhoff Institute for Physics (KIP). The experimental imaging / DNA-repair / chromatin / radiation-biology line produced 11 peer-reviewed research publications — first- and shared-first author — not genomics papers."
  - "As a Cintellic consultant for an international bank, architected the migration of 1,000+ analytical processes to Google Cloud and shipped BigQueryML models for anti-financial-crime & KYC. Previously at neuefische, coached 100+ specialists in Python, SQL & ML; in research, secured third-party funding and supervised 10+ students."
variants:
  comp-bio:
    tagline: "Bioinformatician with deep roots in cancer genomics: production Python, SQL, and GCP engineering alongside cancer-genomics pipelines from real-patient NGS/RNA-Seq, plus eight years of academic research with eleven peer-reviewed publications in imaging, DNA repair, chromatin, and radiation biology. M.Sc. Molecular Biotechnology; builds reproducible Snakemake workflows."
    lead_paragraph: "Engineered in-silico pipelines for HLA typing and neoantigen candidate discovery from real-patient NGS and RNA-Seq data at NCT and SNU (unpublished computational project work), later packaged as reproducible Snakemake workflows. A parallel experimental-biophysics line at DKFZ, FZ Jülich, and KIP produced 11 peer-reviewed research publications — first- and shared-first author — in super-resolution microscopy of DNA-damage repair and chromatin, not genomics."
    second_paragraph: "Equally at home in production: migrated 1,000+ analytical processes to Google Cloud, built reproducible data pipelines, and mentored 100+ specialists in Python, SQL & ML — while securing third-party funding and supervising 10+ students."
  ds-ml:
    tagline: "Data scientist shipping production ML on GCP, grounded in bioinformatics and experimental biophysics with 11 peer-reviewed research publications."
    lead_paragraph: "Builds and ships machine-learning systems end to end, bringing the experimental rigor of a research decade across bioinformatics and experimental biophysics to every model and pipeline."
    second_paragraph: "In industry: architected the migration of 1,000+ analytical processes to Google Cloud, shipped BigQueryML models for anti-financial-crime & KYC, and coached 100+ specialists in Python, SQL & ML."
