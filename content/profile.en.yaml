tagline: "Senior Bioinformatics Engineer specializing in cancer immunogenomics — HLA typing, neoantigen discovery, and splice-junction analysis on real-patient WES (NCT Heidelberg) and TCGA RNA-Seq data."
paragraphs:
  - "At Cintellic: architected migration of 1,000+ analytical processes to Google Cloud. Research background: 10+ peer-reviewed publications, including first- and shared-first-author work in Cancers, Epigenetics Methods, and OBM Genetics across super-resolution chromatin and radiation biology, grounded in wet-lab training and bioinformatics pipeline development at DKFZ, NCT, FZ Jülich, KIP, and SNU."
