answer_block: "Research discipline meets production delivery — transforming complex biological and operational data into reproducible systems, practical models and decisions people can act on."
tagline: "Data scientist with bioinformatics roots — eight years of academic research, 12 peer-reviewed publications, production ML and cloud consulting on GCP; 1,000+ analytical processes migrated, 100+ specialists coached."
paragraphs:
  - "Worked across bioinformatics and experimental biophysics: unpublished NGS/RNA-Seq genomics project work (HLA typing and splice-derived neoepitope candidate pipelines) at the National Center for Tumor Diseases (NCT) and Seoul National University (SNU), plus quantitative bioimage analysis and wet-lab research at the German Cancer Research Center (DKFZ), Forschungszentrum Jülich (FZ Jülich), and Kirchhoff Institute for Physics (KIP). The experimental-biophysics line comprised a coordinated portfolio of multiple concurrent imaging, DNA-repair, chromatin, and radiation-biology projects and produced 12 peer-reviewed research publications — first- and shared-first author — not genomics papers."
  - "As a Cintellic consultant for an international bank, architected the migration of 1,000+ analytical processes to Google Cloud and shipped BigQueryML models for anti-financial-crime & KYC. Previously at neuefische, coached 100+ specialists in Python, SQL & ML; in research, secured third-party funding and supervised 10+ students."
variants:
  comp-bio:
    tagline: "Computational scientist and bioinformatician (M.Sc. Molecular Biotechnology) with hands-on NGS workflows for HLA typing and predicted splice-derived MHC-I neoepitope candidates, plus production Python/cloud data engineering. Maintains a public Snakemake pipeline from RNA-Seq to ranked neoepitope candidates. Twelve peer-reviewed publications from a separate multi-project imaging, DNA-repair, chromatin, and radiation-biology portfolio."
    lead_paragraph: "Engineered in-silico pipelines for HLA typing and neoantigen candidate discovery from real-patient NGS and RNA-Seq data at NCT and SNU (unpublished computational project work), later packaged as reproducible Snakemake workflows. A coordinated experimental-biophysics portfolio at DKFZ, FZ Jülich, and KIP comprised multiple concurrent super-resolution, DNA-damage-repair, and chromatin-analysis projects and produced 12 peer-reviewed research publications — first- and shared-first author — not genomics papers."
    second_paragraph: "Equally at home in production: migrated 1,000+ analytical processes to Google Cloud, built reproducible data pipelines, and mentored 100+ specialists in Python, SQL & ML — while securing third-party funding and supervising 10+ students."
  ds-ml:
    tagline: "Data scientist shipping production ML on GCP, grounded in bioinformatics and experimental biophysics with 12 peer-reviewed research publications."
    lead_paragraph: "Builds and ships machine-learning systems end to end, bringing the experimental rigor of a research decade across bioinformatics and experimental biophysics to every model and pipeline."
    second_paragraph: "In industry: architected the migration of 1,000+ analytical processes to Google Cloud, shipped BigQueryML models for anti-financial-crime & KYC, and coached 100+ specialists in Python, SQL & ML."
