# Canonical, source-backed skills inventory. Target variants select a concise view
# for the website and application PDFs; non-projected renderers retain this full
# taxonomy. Each skill appears in one category only so AI/ML and developer tools
# stay distinct from data/cloud engineering.
categories:
  - name:
      en: "Bioinformatics"
      de: "Bioinformatik"
    groups:
      - label: { en: "Genomics", de: "Genomik" }
        items: ["NGS", "RNA-Seq", "WES", "SNV Calling", "Splice Analysis"]
      - label: { en: "Bioinformatics Workflows", de: "Bioinformatik-Workflows" }
        items: ["Snakemake", "MapSplice", "HISAT2/STAR", "samtools/bcftools", "bedtools", "OptiType"]
      - label: { en: "Immunoinformatics", de: "Immunoinformatik" }
        items: ["HLA Typing", "MHC-I Prediction", "Neoepitopes"]
      - label: { en: "Quantitative Bioimaging", de: "Quantitative Biobildgebung" }
        items: ["Spatial Point-Pattern", "Cluster Analysis (DBSCAN)"]
    variants:
      bridge:
        omit_groups: ["Bioinformatics Workflows", "Immunoinformatics"]
        group_items:
          Genomics: ["NGS", "RNA-Seq", "WES", "SNV Calling"]
      comp-bio:
        group_items:
          Genomics: ["NGS", "RNA-Seq", "Splice Analysis"]
          "Bioinformatics Workflows": ["Snakemake", "MapSplice", "HISAT2/STAR", "bedtools", "OptiType"]
          Immunoinformatics: ["HLA Typing", "MHC-I Prediction", "Neoepitopes"]
      ds-ml:
        omit_groups: ["Bioinformatics Workflows", "Immunoinformatics"]
        group_items:
          Genomics: ["NGS", "RNA-Seq"]

  - name:
      en: "AI/ML & Developer Tools"
      de: "KI/ML & Entwicklerwerkzeuge"
    groups:
      - label: { en: "Machine Learning", de: "Maschinelles Lernen" }
        items: ["TensorFlow", "Keras", "LSTMs", "OpenCV", "MLflow", "BigQueryML"]
      - label: { en: "Computational Modelling", de: "Computergestützte Modellierung" }
        items: ["MHCflurry", "TCRdock", "AlphaFold v2", "Mol*"]
      - label: { en: "AI Agents", de: "KI-Agenten" }
        items: ["Claude Code", "Codex", "OpenCode"]
      - label: { en: "Browser ML Delivery", de: "Browser-ML-Auslieferung" }
        items: ["TensorFlow.js", "ONNX Runtime Web", "Chrome Extension (Manifest V3)"]
      - label: { en: "Developer Environments", de: "Entwicklungsumgebungen" }
        items: ["Conda", "Docker", "Git", "Nix", "nix-darwin", "home-manager", "WezTerm", "Neovim"]
    variants:
      bridge:
        omit_groups: ["Computational Modelling"]
        group_items:
          "Machine Learning": ["TensorFlow", "Keras", "MLflow", "BigQueryML"]
          "AI Agents": ["Claude Code"]
          "Browser ML Delivery": ["TensorFlow.js", "ONNX Runtime Web"]
          "Developer Environments": ["Docker", "Git"]
      comp-bio:
        omit_groups: ["Machine Learning", "AI Agents", "Browser ML Delivery"]
        group_items:
          "Developer Environments": ["Conda", "Docker", "Git"]
      ds-ml:
        omit_groups: ["Computational Modelling"]
        group_items:
          "AI Agents": ["Claude Code", "Codex", "OpenCode"]
          "Developer Environments": ["Docker", "Git"]

  - name:
      en: "Data & Cloud Engineering"
      de: "Daten- & Cloud-Engineering"
    groups:
      - label: { en: "Programming & Data", de: "Programmierung & Daten" }
        items: ["Python (Expert)", "R", "SQL", "dbt"]
      - label: { en: "Cloud & Analytics", de: "Cloud & Analytik" }
        items: ["GCP", "BigQuery", "Looker"]
    variants:
      bridge:
        group_items:
          "Programming & Data": ["Python (Expert)", "R", "SQL"]
          "Cloud & Analytics": ["GCP", "BigQuery"]
      comp-bio:
        group_items:
          "Programming & Data": ["Python (Expert)", "R"]
          "Cloud & Analytics": ["GCP"]
      ds-ml:
        group_items:
          "Programming & Data": ["Python (Expert)", "R", "SQL", "dbt"]
          "Cloud & Analytics": ["GCP", "BigQuery", "Looker"]

  - name:
      en: "Experimental Research"
      de: "Experimentelle Forschung"
    groups:
      - label: { en: "Models", de: "Modelle" }
        items: ["3D Cell Culture", "Neural Progenitors"]
      - label: { en: "Imaging", de: "Bildgebung" }
        items: ["Super-Resolution", "Fluorescence"]
      - label: { en: "Assays", de: "Analysemethoden" }
        items: ["FISH", "qPCR", "FACS"]
    variants:
      bridge:
        group_items:
          Imaging: ["Super-Resolution"]
      ds-ml:
        omit_groups: ["Models", "Assays"]
        group_items:
          Imaging: ["Super-Resolution"]

variants:
  bridge:
    category_order:
      - "Bioinformatics"
      - "AI/ML & Developer Tools"
      - "Data & Cloud Engineering"
      - "Experimental Research"
  comp-bio:
    category_order:
      - "Bioinformatics"
      - "AI/ML & Developer Tools"
      - "Data & Cloud Engineering"
      - "Experimental Research"
  ds-ml:
    category_order:
      - "AI/ML & Developer Tools"
      - "Data & Cloud Engineering"
      - "Bioinformatics"
      - "Experimental Research"
