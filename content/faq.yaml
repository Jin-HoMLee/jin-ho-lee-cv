faqs:
  - id: who-is-jin-ho-lee
    question:
      en: "Who is Jin-Ho Lee?"
      de: "Wer ist Jin-Ho Lee?"
    answer:
      en: "Jin-Ho Lee combines cancer-genomics research with production data science and ML/AI engineering. He is based in Mannheim, Germany, and holds an M.Sc. in Molecular Biotechnology from Heidelberg University."
      de: "Jin-Ho Lee verbindet Krebsgenomik-Forschung mit produktionsnahem Data Science und ML/AI-Engineering. Er lebt in Mannheim und hat einen M.Sc. in Molekularer Biotechnologie der Universität Heidelberg."

  - id: what-is-his-background
    question:
      en: "What is Jin-Ho Lee's professional background?"
      de: "Welchen beruflichen Hintergrund hat Jin-Ho Lee?"
    answer:
      en: "Jin-Ho Lee spent eight years in doctoral and post-graduate research across Forschungszentrum Jülich, Kirchhoff Institute for Physics, National Center for Tumor Diseases, Seoul National University and the German Cancer Research Center, working on cancer genomics and super-resolution microscopy. He then moved to industry as a data science coach at neuefische and as a consultant and lead business functional analyst employed by Cintellic GmbH for an international bank; he now works independently on ML/AI engineering and open-source tooling."
      de: "Jin-Ho Lee forschte acht Jahre als Doktorand und postgraduierter Forscher am Forschungszentrum Jülich, am Kirchhoff-Institut für Physik, am Nationalen Centrum für Tumorerkrankungen, an der Seoul National University und am Deutschen Krebsforschungszentrum zu Krebsgenomik und hochauflösender Mikroskopie. Anschließend wechselte er als Data-Science-Coach zu neuefische und als von Cintellic GmbH beschäftigter Berater und Lead Business Functional Analyst zu einem Projekt für eine internationale Bank; heute arbeitet er unabhängig an ML/AI-Engineering und Open-Source-Tooling."

  - id: what-are-his-skills
    question:
      en: "What technical skills does Jin-Ho Lee have?"
      de: "Welche technischen Fähigkeiten hat Jin-Ho Lee?"
    answer:
      en: "Jin-Ho Lee works in Python, SQL and R, with machine learning in TensorFlow, bioinformatics pipelines in Snakemake, and cloud data engineering on Google Cloud including BigQuery and BigQueryML. His domain expertise spans cancer genomics, NGS and RNA-Seq analysis, HLA typing, neoantigen discovery, and spatial point-pattern analysis."
      de: "Jin-Ho Lee arbeitet mit Python, SQL und R, mit Machine Learning in TensorFlow, Bioinformatik-Pipelines in Snakemake sowie Cloud Data Engineering auf der Google Cloud inklusive BigQuery und BigQueryML. Seine Fachexpertise umfasst Krebsgenomik, NGS- und RNA-Seq-Analyse, HLA-Typisierung, Neoantigen-Identifizierung und räumliche Punktmusteranalyse."

  - id: what-has-he-published
    question:
      en: "What has Jin-Ho Lee published?"
      de: "Was hat Jin-Ho Lee publiziert?"
    answer:
      en: "Jin-Ho Lee has 11 peer-reviewed research publications (10 articles and 1 research book chapter), including first-author and shared-first-author papers, in radiation biophysics and super-resolution imaging of DNA-damage repair and chromatin architecture. The full list with citation counts is available via his ORCID record (0009-0001-8784-1771) and Google Scholar profile."
      de: "Jin-Ho Lee hat 11 peer-reviewed Forschungspublikationen (10 Artikel und 1 wissenschaftliches Buchkapitel), darunter Arbeiten als Erstautor und mit geteilter Erstautorschaft, in der Strahlenbiophysik und der hochauflösenden Bildgebung von DNA-Schadensreparatur und Chromatin-Architektur. Die vollständige Liste mit Zitationszahlen ist über seinen ORCID-Eintrag (0009-0001-8784-1771) und sein Google-Scholar-Profil verfügbar."

  - id: what-does-he-work-on-now
    question:
      en: "What is Jin-Ho Lee working on now?"
      de: "Woran arbeitet Jin-Ho Lee derzeit?"
    answer:
      en: "Jin-Ho Lee currently works independently on agentic AI systems - LLM agents with tool use, planning, routing, multi-agent orchestration and persistent memory - alongside open-source Claude Code tooling, a real-time, fully on-device computer-vision Chrome extension for badminton match analysis, and a reproducible Snakemake splice-neoepitope discovery pipeline with AlphaFold2 structural validation."
      de: "Jin-Ho Lee arbeitet derzeit unabhängig an agentischen KI-Systemen - LLM-Agenten mit Tool-Nutzung, Planung, Routing, Multi-Agenten-Orchestrierung und persistentem Speicher - sowie an Open-Source-Tooling für Claude Code, einer Chrome-Erweiterung, die Echtzeit-Computer-Vision vollständig client-seitig auf Badminton-Spielaufnahmen ausführt, und einer reproduzierbaren Snakemake-Pipeline zur Splice-Neoepitop-Identifizierung mit struktureller Validierung via AlphaFold2."

  - id: is-he-available-for-work
    question:
      en: "Is Jin-Ho Lee available for new opportunities?"
      de: "Ist Jin-Ho Lee für neue Positionen verfügbar?"
    answer:
      en: "Jin-Ho Lee's stated availability: open to roles in bioinformatics, computational biology and data science, based in Mannheim, Germany. The fastest way to reach him is the contact form on this site or the digital twin chat, which answers detailed questions about his experience and can pass on a message."
      de: "Jin-Ho Lees erklärte Verfügbarkeit: offen für Positionen in Bioinformatik, Computational Biology und Data Science, mit Sitz in Mannheim. Der schnellste Weg, ihn zu erreichen, ist das Kontaktformular auf dieser Seite oder der Digital-Twin-Chat, der detaillierte Fragen zu seiner Erfahrung beantwortet und eine Nachricht weiterleiten kann."
