tagline: "Data Scientist mit Wurzeln in der Krebsgenomik — HLA-Typisierung & Neoantigen-Identifizierung an echten Patientendaten, Produktiv-ML auf GCP, 10+ Publikationen."
paragraphs:
  - "Data Scientist mit tiefen Wurzeln in der Krebsgenomik. Entwicklung von In-silico-Pipelines zur HLA-Typisierung und Neoantigen-Identifizierung aus realen Patienten-NGS- und RNA-Seq-Daten, gestützt auf 10+ peer-reviewed Publikationen — als Erstautor sowie mit geteilter Erstautorschaft in Cancers, Epigenetics Methods und OBM Genetics —, aufbauend auf Wet-Lab-Ausbildung und Pipeline-Entwicklung an DKFZ, NCT, FZ Jülich, KIP und SNU."
  - "Diese Sorgfalt nun in der Industrie: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud, Entwicklung von BigQueryML-Modellen für Geldwäscheprävention & KYC sowie Schulung von 100+ Fachkräften in Python, SQL & ML; Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
variants:
  comp-bio:
    tagline: "Bioinformatiker mit tiefen Wurzeln in der Krebsgenomik — HLA-Typisierung & Neoantigen-Identifizierung aus echten Patienten-NGS/RNA-Seq, reproduzierbare Snakemake-Pipelines, 10+ Publikationen."
    lead_paragraph: "Bioinformatiker mit Spezialisierung auf HLA-Typisierung und Neoantigen-Identifizierung — Entwicklung von In-silico-Pipelines aus realen Patienten-NGS- und RNA-Seq-Daten, verpackt als reproduzierbare Snakemake-Workflows. Gestützt auf 10+ peer-reviewed Publikationen als Erst- und geteilter Erstautor in Cancers, Epigenetics Methods und OBM Genetics, aufbauend auf Wet-Lab-Ausbildung an DKFZ, NCT, FZ Jülich, KIP und SNU."
    second_paragraph: "Ebenso zu Hause in der Produktion: Migration von 1.000+ analytischen Prozessen in die Google Cloud, Aufbau reproduzierbarer Daten-Pipelines und Mentoring von 100+ Fachkräften in Python, SQL & ML — bei gleichzeitiger Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
  ds-ml:
    tagline: "Data Scientist mit Produktiv-ML auf GCP, aufbauend auf einem Jahrzehnt Krebsgenomik-Forschung und 10+ peer-reviewed Publikationen."
    lead_paragraph: "Produktionsorientierter Data Scientist, der Machine-Learning-Systeme durchgängig entwickelt und ausliefert — und die experimentelle Sorgfalt eines Jahrzehnts in der Krebsgenomik sowie 10+ peer-reviewed Publikationen in jedes Modell und jede Pipeline einbringt."
    second_paragraph: "In der Industrie: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud, Entwicklung von BigQueryML-Modellen für Geldwäscheprävention & KYC sowie Schulung von 100+ Fachkräften in Python, SQL & ML."
