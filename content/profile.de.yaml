tagline: "Senior Bioinformatiker mit Fokus auf Krebs-Immunogenomik — HLA-Typisierung, Neoantigen-Identifizierung und Splice-Junction-Analyse aus realen Patienten-WES-Daten (NCT Heidelberg) und TCGA-RNA-Seq-Daten."
paragraphs:
  - "Aktuelle Industrie-Tätigkeit bei Cintellic: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud. Forschungshintergrund: 10+ peer-reviewed Publikationen, darunter mit Erstautor- und geteilter Erstautorschaft in Cancers, Epigenetics Methods und OBM Genetics zu Super-Resolution-Chromatin und Strahlenbiologie, aufbauend auf Wet-Lab-Ausbildung und Bioinformatik-Pipeline-Entwicklung an DKFZ, NCT, FZ Jülich, KIP und SNU. Aktives Projekt: Open-Source-Snakemake-Pipeline für Splice-Junction-basierte Neoantigen-Identifizierung."
