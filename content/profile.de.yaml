tagline: "Senior Bioinformatiker mit Fokus auf Tumor-Immunogenomik — HLA-Typisierung, Neoantigen-Identifizierung und Splice-Junction-Analyse an realen Patienten-WES-Daten (NCT Heidelberg) und TCGA-RNA-Seq-Daten."
paragraphs:
  - "Aktuelle Industrietätigkeit bei Cintellic: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud. Forschungshintergrund: 10+ peer-reviewed Publikationen, darunter als Erstautor sowie mit geteilter Erstautorschaft in Cancers, Epigenetics Methods und OBM Genetics zu Super-Resolution-Chromatin und Strahlenbiologie, aufbauend auf Wet-Lab-Ausbildung und Bioinformatik-Pipeline-Entwicklung an DKFZ, NCT, FZ Jülich, KIP und SNU; Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
