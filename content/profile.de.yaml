answer_block: "Jin-Ho Lee ist Data Scientist mit Wurzeln in der Bioinformatik und lebt in Mannheim. Er entwickelt produktive Machine-Learning- und Datenpipelines, bringt Google-Cloud-Beratungserfahrung aus dem internationalen Bankenumfeld mit und hat 100+ Fachkräfte in Python, SQL und ML geschult. Er hat einen M.Sc. der Universität Heidelberg und 11 peer-reviewed Forschungspublikationen."
tagline: "Data Scientist mit Wurzeln in der Bioinformatik — Produktiv-ML und Cloud-Beratung auf GCP; Migration von 1.000+ analytischen Prozessen und Coaching von 100+ Fachkräften."
paragraphs:
  - "Arbeit in Bioinformatik und experimenteller Biophysik, mit Entwicklung von NGS/RNA-Seq-Pipelines, quantitativer Biobildanalyse und Wet-Lab-Forschung am Deutschen Krebsforschungszentrum (DKFZ), am Nationalen Centrum für Tumorerkrankungen (NCT), am Forschungszentrum Jülich, am Kirchhoff-Institut für Physik (KIP) und an der Seoul National University (SNU). Daraus entstanden 11 peer-reviewed Forschungspublikationen — als Erstautor sowie mit geteilter Erstautorschaft — in der hochauflösenden Mikroskopie von DNA-Schadensreparatur und Chromatin."
  - "Als Cintellic-Berater für eine internationale Bank Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud und Entwicklung von BigQueryML-Modellen für Geldwäscheprävention & KYC. Zuvor bei neuefische Coaching von 100+ Fachkräften in Python, SQL & ML; in der Forschung Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
variants:
  comp-bio:
    tagline: "Bioinformatiker mit tiefen Wurzeln in der Krebsgenomik — HLA-Typisierung & Neoantigen-Identifizierung aus echten Patienten-NGS/RNA-Seq, reproduzierbare Snakemake-Pipelines, 11 peer-reviewed Forschungspublikationen."
    lead_paragraph: "Entwicklung von In-silico-Pipelines zur HLA-Typisierung und Neoantigen-Identifizierung aus realen Patienten-NGS- und RNA-Seq-Daten, verpackt als reproduzierbare Snakemake-Workflows, mit Wet-Lab-Ausbildung am Deutschen Krebsforschungszentrum (DKFZ), am Nationalen Centrum für Tumorerkrankungen (NCT), am Forschungszentrum Jülich, am Kirchhoff-Institut für Physik (KIP) und an der Seoul National University (SNU). Eine parallele Forschungslinie in der experimentellen Biophysik brachte 11 peer-reviewed Forschungspublikationen — als Erst- und geteilter Erstautor — in der hochauflösenden Mikroskopie von DNA-Schadensreparatur und Chromatin hervor."
    second_paragraph: "Ebenso zu Hause in der Produktion: Migration von 1.000+ analytischen Prozessen in die Google Cloud, Aufbau reproduzierbarer Daten-Pipelines und Mentoring von 100+ Fachkräften in Python, SQL & ML — bei gleichzeitiger Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
  ds-ml:
    tagline: "Data Scientist mit Produktiv-ML auf GCP, fundiert durch Bioinformatik und experimentelle Biophysik mit 11 peer-reviewed Forschungspublikationen."
    lead_paragraph: "Entwicklung und Auslieferung von Machine-Learning-Systemen durchgängig — mit der experimentellen Sorgfalt eines Forschungsjahrzehnts in Bioinformatik und experimenteller Biophysik in jedem Modell und jeder Pipeline."
    second_paragraph: "In der Industrie: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud, Entwicklung von BigQueryML-Modellen für Geldwäscheprävention & KYC sowie Schulung von 100+ Fachkräften in Python, SQL & ML."
