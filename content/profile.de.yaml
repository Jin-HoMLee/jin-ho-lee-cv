answer_block: "Jin-Ho Lee ist Bioinformatiker und Data Scientist in Mannheim. Er entwickelt In-silico-Pipelines zur HLA-Typisierung und Neoantigen-Identifizierung aus NGS- und RNA-Seq-Daten von Krebspatienten und liefert produktives Machine Learning auf der Google Cloud. Er hat einen M.Sc. der Universität Heidelberg und 10+ peer-reviewed Publikationen."
tagline: "Data Scientist mit Wurzeln in der Krebsgenomik — HLA-Typisierung & Neoantigen-Identifizierung an echten Patientendaten, Produktiv-ML auf GCP, 10+ Publikationen."
paragraphs:
  - "Data Scientist mit tiefen Wurzeln in der Krebsgenomik. Entwicklung von In-silico-Pipelines zur HLA-Typisierung und Neoantigen-Identifizierung aus realen Patienten-NGS- und RNA-Seq-Daten, aufbauend auf Wet-Lab-Ausbildung und Pipeline-Entwicklung an DKFZ, NCT, FZ Jülich, KIP und SNU. Eine parallele Forschungslinie in der experimentellen Biophysik brachte 10+ peer-reviewed Publikationen — als Erstautor sowie mit geteilter Erstautorschaft — in der hochauflösenden Mikroskopie von DNA-Schadensreparatur und Chromatin hervor."
  - "Diese Sorgfalt nun in der Industrie: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud, Entwicklung von BigQueryML-Modellen für Geldwäscheprävention & KYC sowie Schulung von 100+ Fachkräften in Python, SQL & ML; Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
