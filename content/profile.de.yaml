tagline: "Senior Bioinformatiker mit 10+ peer-reviewed Publikationen und End-to-End-Erfahrung in NGS/RNA-Seq-Pipelines, Super-Resolution-Bildanalyse und Cloud-Analytics in der Produktion."
paragraphs:
  - "Spezialist für HLA-Typisierung, Neoantigen-Identifizierung und Splice-Junction-Analyse (Python, R, NGS-Toolchain). Aktueller Industriebezug: 1.000+ analytische Prozesse in die Google Cloud migriert und BigQueryML-Modelle für Geldwäscheprävention entwickelt — aufbauend auf fundierter Wet-Lab- und Bioinformatik-Erfahrung aus DKFZ, NCT, FZ Jülich, KIP und SNU."
