answer_block: "Jin-Ho Lee ist Data Scientist mit Wurzeln in der Bioinformatik und lebt in Mannheim. Er forschte acht Jahre akademisch in Bioinformatik und experimenteller Biophysik mit 12 peer-reviewed Forschungspublikationen, entwickelt heute produktive Machine-Learning- und Datenpipelines, bringt Google-Cloud-Beratungserfahrung aus dem internationalen Bankenumfeld mit und hat 100+ Fachkräfte in Python, SQL und ML geschult. Er hat einen M.Sc. der Universität Heidelberg."
tagline: "Data Scientist mit Wurzeln in der Bioinformatik — acht Jahre akademische Forschung, 12 peer-reviewed Publikationen, Produktiv-ML und Cloud-Beratung auf GCP; Migration von 1.000+ analytischen Prozessen und Coaching von 100+ Fachkräften."
paragraphs:
  - "Arbeit in Bioinformatik und experimenteller Biophysik: unveröffentlichte NGS/RNA-Seq-Genomik-Projektarbeit (HLA-Typisierung und Pipelines für splice-abgeleitete Neoepitop-Kandidaten) am Nationalen Centrum für Tumorerkrankungen (NCT) und an der Seoul National University (SNU), plus quantitative Biobildanalyse und Wet-Lab-Forschung am Deutschen Krebsforschungszentrum (DKFZ), am Forschungszentrum Jülich und am Kirchhoff-Institut für Physik (KIP). Die experimentelle Linie zu Bildgebung / DNA-Reparatur / Chromatin / Strahlenbiologie brachte 12 peer-reviewed Forschungspublikationen — als Erstautor sowie mit geteilter Erstautorschaft — hervor, keine Genomik-Publikationen."
  - "Als Cintellic-Berater für eine internationale Bank Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud und Entwicklung von BigQueryML-Modellen für Geldwäscheprävention & KYC. Zuvor bei neuefische Coaching von 100+ Fachkräften in Python, SQL & ML; in der Forschung Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
variants:
  comp-bio:
    tagline: "Computational Scientist und Bioinformatiker (M.Sc. Molekulare Biotechnologie) mit praktischer NGS-Arbeit an realen Patienten-WES/NGS-Daten (HLA-Typisierung, Screening patientenspezifischer Krebs-Targets) und vorhergesagten splice-abgeleiteten MHC-I-Neoepitop-Kandidaten sowie produktivem Python-/Cloud-Data-Engineering. Pflegt eine öffentliche Snakemake-Pipeline von RNA-Seq bis gerankten Neoepitop-Kandidaten. Zwölf peer-reviewed Publikationen aus einer getrennten Forschungslinie zu Bildgebung, DNA-Reparatur, Chromatin und Strahlenbiologie. Doktoratsforschung am FZ Jülich durchgeführt (Promotion nicht abgeschlossen)."
    lead_paragraph: "Entwicklung von In-silico-Pipelines zur HLA-Typisierung und Neoantigen-Kandidatenidentifizierung aus realen Patienten-NGS- und RNA-Seq-Daten am NCT und an der SNU (unveröffentlichte computergestützte Projektarbeit), später als reproduzierbare Snakemake-Workflows paketiert. Eine parallele experimentelle Biophysik-Linie am DKFZ, FZ Jülich und KIP brachte 12 peer-reviewed Forschungspublikationen — als Erst- und geteilter Erstautor — in der hochauflösenden Mikroskopie von DNA-Schadensreparatur und Chromatin hervor, keine Genomik-Publikationen."
    second_paragraph: "Ebenso zu Hause in der Produktion: Migration von 1.000+ analytischen Prozessen in die Google Cloud, Aufbau reproduzierbarer Daten-Pipelines und Mentoring von 100+ Fachkräften in Python, SQL & ML — bei gleichzeitiger Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
  ds-ml:
    tagline: "Data Scientist mit Produktiv-ML auf GCP, fundiert durch Bioinformatik und experimentelle Biophysik mit 12 peer-reviewed Forschungspublikationen."
    lead_paragraph: "Entwicklung und Auslieferung von Machine-Learning-Systemen durchgängig — mit der experimentellen Sorgfalt eines Forschungsjahrzehnts in Bioinformatik und experimenteller Biophysik in jedem Modell und jeder Pipeline."
    second_paragraph: "In der Industrie: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud, Entwicklung von BigQueryML-Modellen für Geldwäscheprävention & KYC sowie Schulung von 100+ Fachkräften in Python, SQL & ML."
