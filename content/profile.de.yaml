answer_block: "Data Scientist und ML Engineer für produktives ML auf GCP, verankert in Bioinformatik und experimenteller Biophysik — komplexe Daten werden zu reproduzierbaren Systemen, praxistauglichen Modellen und fundierten Entscheidungen."
tagline: "Data Scientist und ML Engineer mit Wurzeln in der Bioinformatik — produktives ML und Cloud-Delivery auf GCP."
paragraphs:
  - "Arbeit in Bioinformatik und experimenteller Biophysik: unveröffentlichte NGS/RNA-Seq-Genomik-Projektarbeit (HLA-Typisierung und Pipelines für splice-abgeleitete Neoepitop-Kandidaten) am Nationalen Centrum für Tumorerkrankungen (NCT) und an der Seoul National University (SNU), plus quantitative Biobildanalyse und Wet-Lab-Forschung am Deutschen Krebsforschungszentrum (DKFZ), am Forschungszentrum Jülich und am Kirchhoff-Institut für Physik (KIP). Die experimentell-biophysikalische Linie umfasste ein koordiniertes Forschungsportfolio aus mehreren parallelen Projekten zu Bildgebung, DNA-Reparatur, Chromatin und Strahlenbiologie und brachte 12 peer-reviewed Forschungspublikationen — als Erstautor sowie mit geteilter Erstautorschaft — hervor, keine Genomik-Publikationen."
  - "Als Cintellic-Berater für eine internationale Bank Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud und Entwicklung von BigQueryML-Modellen für Anti-Financial Crime & KYC. Bei neuefische: Unterricht von 100+ Fachkräften in Python, SQL und ML-Lebenszyklen im Rahmen praxisnaher Data-Science-Kohorten; in der Forschung Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
variants:
  comp-bio:
    tagline: "Computational Biologist und Bioinformatiker (M.Sc. Molekulare Biotechnologie) mit praktischer NGS-Arbeit zu HLA-Typisierung und vorhergesagten splice-abgeleiteten MHC-I-Neoepitop-Kandidaten sowie produktivem Python-/Cloud-Data-Engineering."
    lead_paragraph: "Entwicklung von In-silico-Pipelines zur HLA-Typisierung und Neoantigen-Kandidatenidentifizierung aus realen Patienten-NGS- und RNA-Seq-Daten am NCT und an der SNU (unveröffentlichte computergestützte Projektarbeit), später in reproduzierbare Snakemake-Workflows überführt. Ein koordiniertes Forschungsportfolio in experimenteller Biophysik am DKFZ, FZ Jülich und KIP umfasste mehrere parallel laufende Projekte zu Super-Resolution, DNA-Schadensreparatur und Chromatinanalyse und brachte 12 peer-reviewed Forschungspublikationen — als Erst- bzw. geteilter Erstautor — hervor, keine Genomik-Publikationen."
    second_paragraph: "Ebenso zu Hause in der Produktion: Migration von 1.000+ analytischen Prozessen in die Google Cloud, Aufbau reproduzierbarer Daten-Pipelines und Unterricht von 100+ Fachkräften in Python, SQL und ML-Lebenszyklen im Rahmen praxisnaher Data-Science-Kohorten — bei gleichzeitiger Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
  ds-ml:
    tagline: "Data Scientist und ML Engineer für produktives ML auf GCP, verankert in Bioinformatik und experimenteller Biophysik."
    lead_paragraph: "Durchgängige Entwicklung und Produktivsetzung von Machine-Learning-Systemen — mit der experimentellen Sorgfalt eines Jahrzehnts Forschung in Bioinformatik und experimenteller Biophysik, die in jedes Modell und jede Pipeline einfließt."
    second_paragraph: "In der Industrie: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud, Entwicklung von BigQueryML-Modellen für Anti-Financial Crime & KYC sowie Unterricht von 100+ Fachkräften in Python, SQL und ML-Lebenszyklen im Rahmen praxisnaher Data-Science-Kohorten."
