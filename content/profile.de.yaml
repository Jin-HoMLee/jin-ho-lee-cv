answer_block: "Forschungsdisziplin trifft produktionsreife Umsetzung — in Bioinformatik, Data Science und ML."
tagline: "Data Scientist mit Wurzeln in der Bioinformatik — acht Jahre akademische Forschung, 12 peer-reviewed Publikationen, ML in der Produktion und Cloud-Beratung auf GCP; Migration von 1.000+ analytischen Prozessen und Coaching von 100+ Fachkräften."
paragraphs:
  - "Arbeit in Bioinformatik und experimenteller Biophysik: unveröffentlichte NGS/RNA-Seq-Genomik-Projektarbeit (HLA-Typisierung und Pipelines für splice-abgeleitete Neoepitop-Kandidaten) am Nationalen Centrum für Tumorerkrankungen (NCT) und an der Seoul National University (SNU), plus quantitative Biobildanalyse und Wet-Lab-Forschung am Deutschen Krebsforschungszentrum (DKFZ), am Forschungszentrum Jülich und am Kirchhoff-Institut für Physik (KIP). Die experimentell-biophysikalische Linie umfasste ein koordiniertes Forschungsportfolio aus mehreren parallelen Projekten zu Bildgebung, DNA-Reparatur, Chromatin und Strahlenbiologie und brachte 12 peer-reviewed Forschungspublikationen — als Erstautor sowie mit geteilter Erstautorschaft — hervor, keine Genomik-Publikationen."
  - "Als Cintellic-Berater für eine internationale Bank Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud und Entwicklung von BigQueryML-Modellen für Anti-Financial Crime & KYC. Zuvor bei neuefische Coaching von 100+ Fachkräften in Python, SQL & ML; in der Forschung Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
variants:
  comp-bio:
    tagline: "Computational Scientist und Bioinformatiker (M.Sc. Molekulare Biotechnologie) mit praktischer NGS-Arbeit zu HLA-Typisierung und vorhergesagten splice-abgeleiteten MHC-I-Neoepitop-Kandidaten sowie produktivem Python-/Cloud-Data-Engineering. Pflegt eine öffentliche Snakemake-Pipeline von RNA-Seq bis gerankten Neoepitop-Kandidaten. Zwölf peer-reviewed Publikationen aus einem Forschungsportfolio paralleler Projekte zu Bildgebung, DNA-Reparatur, Chromatin und Strahlenbiologie. Promotionsforschung am FZ Jülich durchgeführt (Promotion nicht abgeschlossen)."
    lead_paragraph: "Entwicklung von In-silico-Pipelines zur HLA-Typisierung und Neoantigen-Kandidatenidentifizierung aus realen Patienten-NGS- und RNA-Seq-Daten am NCT und an der SNU (unveröffentlichte computergestützte Projektarbeit), später in reproduzierbare Snakemake-Workflows überführt. Ein koordiniertes Forschungsportfolio in experimenteller Biophysik am DKFZ, FZ Jülich und KIP umfasste mehrere parallel laufende Projekte zu Super-Resolution, DNA-Schadensreparatur und Chromatinanalyse und brachte 12 peer-reviewed Forschungspublikationen — als Erst- bzw. geteilter Erstautor — hervor, keine Genomik-Publikationen."
    second_paragraph: "Ebenso zu Hause in der Produktion: Migration von 1.000+ analytischen Prozessen in die Google Cloud, Aufbau reproduzierbarer Daten-Pipelines und Mentoring von 100+ Fachkräften in Python, SQL & ML — bei gleichzeitiger Einwerbung von Drittmitteln und Betreuung von 10+ Studierenden."
  ds-ml:
    tagline: "Data Scientist für ML in der Produktion auf GCP, verankert in Bioinformatik und experimenteller Biophysik — 12 peer-reviewed Forschungspublikationen."
    lead_paragraph: "Durchgängige Entwicklung und Produktivsetzung von Machine-Learning-Systemen — mit der experimentellen Sorgfalt eines Jahrzehnts Forschung in Bioinformatik und experimenteller Biophysik, die in jedes Modell und jede Pipeline einfließt."
    second_paragraph: "In der Industrie: Architektur der Migration von 1.000+ analytischen Prozessen in die Google Cloud, Entwicklung von BigQueryML-Modellen für Anti-Financial Crime & KYC sowie Schulung von 100+ Fachkräften in Python, SQL & ML."
