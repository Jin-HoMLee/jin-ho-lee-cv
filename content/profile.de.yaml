tagline: "Senior Bioinformatiker mit 10+ peer-reviewten Publikationen und End-to-End-Erfahrung in NGS/RNA-Seq-Pipelines, Super-Resolution-Bildanalyse und produktiven Cloud-Analytics."
paragraphs:
  - "Spezialist für HLA-Typisierung, Neoantigen-Discovery und Splice-Junction-Analyse (Python, R, NGS-Toolchain). Aktueller Industriebezug: 1.000+ analytische Prozesse in die Google Cloud migriert und BigQueryML-Modelle für Geldwäscheprävention entwickelt — aufbauend auf fundierter Wet-Lab- und Bioinformatik-Grundlage von DKFZ, NCT, FZ Jülich, KIP und SNU."
