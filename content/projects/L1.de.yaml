id: L1
category: life-science
title: "Krebs-Neoantigen-Entdeckung – Transkriptomweite Splice-Analyse"
summary: "Unveröffentlichte computergestützte Pipeline zur Vorhersage splice-junction-abgeleiteter Neoepitop-Kandidatenpeptide aus RNA-Seq-Daten."
role: "Bioinformatik-Forschungspraktikant (Seoul National University)"
period:
  start: "2015-08"
  end: "2015-11"
technologies:
  - "Python"
  - "R"
  - "MapSplice"
  - "RNA-Seq"
  - "TCGA Datasets"
  - "MHC-I Prediction Tools"
contributions:
  - "Entwicklung einer Discovery-Pipeline zur Identifizierung vorhergesagter junction-abgeleiteter Kandidatenklassen in großen Krebs-RNA-Seq-Datensätzen."
  - "Vorhersage hochaffiner MHC-I-bindender Kandidatenpeptide aus nicht-kanonischen junction-abgeleiteten Sequenzen."
  - "Abgleich vorhergesagter Kandidaten mit publizierten transkriptomischen Studien."
  - "Vergleich computergestützter mutations- und splice-abgeleiteter Neoepitop-Kandidatenmengen (kein experimenteller Co-Targeting-Anspruch)."
outcome: "Unveröffentlichter computergestützter Machbarkeitsnachweis, der vorhergesagte Kandidatenpeptide ausschließlich aus RNA-Seq-Splice-Junction-Daten erzeugte — ohne nasslaborische oder klinische Bestätigung."

