id: L1
category: life-science
title: "Krebs-Neoantigen-Entdeckung – Transkriptomweite Splice-Analyse"
summary: "Unveröffentlichte computergestützte Pipeline zur Vorhersage splice-junction-abgeleiteter Neoepitop-Kandidatenpeptide aus RNA-Seq-Daten."
role: "Bioinformatik-Forschungspraktikant (Seoul National University)"
period:
  start: "2015-08"
  end: "2015-11"
technologies:
  - "Python"
  - "R"
  - "MapSplice"
  - "RNA-Seq"
  - "TCGA Datasets"
  - "MHC-I Prediction Tools"
contributions:
  - "Entwicklung einer Discovery-Pipeline zur Identifizierung neuer Splice-Junctions in TCGA-Kohorten (BRCA/LUAD/LAML-RNA-Seq)."
  - "Vorhersage HLA-A*02:01-bindender Kandidaten-9-mere aus der Drei-Rahmen-Translation kurzer Junction-Contigs."
  - "Abgleich der Kandidaten-Junctions mit publizierten Transkript-/Isoform-Berichten."
  - "Vergleich computergestützter mutations- und splice-abgeleiteter Neoepitop-Kandidatenmengen (kein experimenteller Co-Targeting-Anspruch)."
outcome: "SNU-Praktikum 2015: unveröffentlichter computergestützter Machbarkeitsnachweis — neue Splice-Junctions in TCGA-BRCA/LUAD/LAML-RNA-Seq, Drei-Rahmen-Translation kurzer Junction-Contigs, von NetMHCpan vorhergesagte HLA-A*02:01-Kandidaten-9-mere. Keine experimentelle Validierung, klinische Nutzung, Publikation oder Patent."

