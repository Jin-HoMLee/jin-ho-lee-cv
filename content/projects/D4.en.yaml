title: "claude-personas – Multi-Persona Framework for Claude Code"
summary: "Framework for running multiple specialized Claude Code personas in parallel, each with its own isolated, role-specific persistent memory, so a solo developer can cover multiple roles across a project."
role: "Author and Maintainer (Open Source)"
