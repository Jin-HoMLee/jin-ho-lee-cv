id: L2
category: life-science
title: "Personalized Immunotherapy – High-Throughput HLA Typing Pipeline"
summary: "B.Sc. thesis project: Bioinformatics workflow for identifying patient-specific cancer targets and automating HLA genotyping from Next-Generation Sequencing (NGS) data."
role: "Bioinformatics Bachelor Thesis Student (NCT Heidelberg)"
period:
  start: "2014-04"
  end: "2014-05"
technologies:
  - "Python"
  - "R"
  - "HLAMiner"
  - "Seq2HLA"
  - "NetMHCPan (Neural Networks)"
  - "Shell Scripting"
contributions:
  - "Developed an in silico genotyping pipeline to extract HLA alleles directly from Whole-Exome Sequencing (WXS) data."
  - "Implemented predictive modeling using ANNs (NetMHCPan) to screen missense mutations for MHC-I binding affinity."
  - "Engineered a consensus methodology integrating multiple HLA typing algorithms to resolve sequence ambiguities and improve call consistency."
  - "Checked the pipeline computationally by comparing binding-specificity predictions across HLA alleles to flag inconsistent allele calls."
outcome: "B.Sc. thesis, NCT Heidelberg: in-silico HLA typing from real-patient WES/NGS and ANN-based MHC-I binding screens for missense-mutation candidates. Unpublished."
