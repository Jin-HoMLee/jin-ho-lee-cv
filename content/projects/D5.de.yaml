title: "dotfiles – Personalisiertes, reproduzierbares Nix-Setup für macOS"
summary: "Ein persönliches, mit einem Befehl reproduzierbares macOS-Setup auf Basis von Nix (nix-darwin + home-manager) — ein personalisierter Fork eines gemeinsam genutzten Open-Source-Dotfiles-Frameworks, erweitert um eigene Pakete, Tools und Multi-Agenten-KI-Konfiguration."
role: "Maintainer (personalisierter Fork, Open Source)"
