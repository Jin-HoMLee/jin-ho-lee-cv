id: L5
category: life-science
title: "Splice Neoepitope Pipeline – Reproducible Snakemake Workflow"
summary: "Modernised, open-source reimplementation of the 2015 SNU splice-junction–based neoepitope discovery work as a reproducible Snakemake pipeline with optional structural validation."
role: "Author and Maintainer (Open Source)"
period:
  start: "2026-03"
  end: null
technologies:
  - "Snakemake 8.x"
  - "Conda"
  - "Python 3.11"
  - "HISAT2 / STAR"
  - "OptiType"
  - "MHCflurry 2.x"
  - "TCRdock / AlphaFold v2"
  - "bedtools"
  - "Google Cloud GPU"
  - "Mol*"
contributions:
  - "Re-engineered the original SNU pipeline as a fully reproducible Snakemake 8.x workflow with per-rule Conda environments — installable without manual dependency management."
  - "Implemented tumor-vs-matched-normal junction filtering against GENCODE annotation, classifying junctions as annotated, normal_shared, or tumor_exclusive."
  - "Integrated patient-specific HLA typing (OptiType) and MHC-I peptide presentation prediction (MHCflurry 2.x Class1PresentationPredictor) for end-to-end neoepitope candidate ranking."
  - "Added optional TCR-pMHC ternary complex structural validation via TCRdock (AlphaFold v2 backend) on Google Cloud GPU; predicted complexes rendered as interactive Mol* 3D viewer in the report."
  - "MIT-licensed, public on GitHub (Jin-HoMLee/splice-neoepitope-pipeline)."
outcome: "Demonstrates end-to-end, cloud-deployable, reproducible neoepitope discovery from RNA-Seq FASTQ to computationally modeled TCR-pMHC complex structure — built on patient-specific HLA alleles and tumor-exclusive junctions."
