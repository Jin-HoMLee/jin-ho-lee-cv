name = "jin-ho-lee-cv-twin"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Per-IP rate-limit + monthly-ceiling counters.
[[kv_namespaces]]
binding = "RATE_KV"
id = "483f911f06854862be9d992ab99423d8"

# Phase 12b digital-twin insights store. The database_id is account-scoped (not a
# secret — same reasoning as the KV id) and is filled in from `wrangler d1 create`.
[[d1_databases]]
binding = "INSIGHTS_DB"
database_name = "twin-insights"
database_id = "fa441841-cc5a-4f4e-9bcd-d160bbb8ebb0"

# chat-context.md is imported as a text module in src/index.ts.
[[rules]]
type = "Text"
globs = ["**/*.md"]

[vars]
# Production values live here (committed). For local `wrangler dev`, override any
# of these in worker/.dev.vars (gitignored) — e.g. add http://localhost:4321 to
# ALLOWED_ORIGIN. See worker/.dev.vars.example.
ALLOWED_ORIGIN = "https://jinholee.is-a.dev"
MONTHLY_CEILING = "5000"
MAX_TOKENS = "700"
# Secrets set via `wrangler secret put`: GEMINI_API_KEY, TURNSTILE_SECRET_KEY

# Phase 12b digest cron — daily ~06:00 UTC during the pilot (change to weekly later).
[triggers]
crons = ["0 6 * * *"]
