name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python deps
        run: uv sync --all-groups

      - name: Render web JSON
        run: uv run python -m scripts.render_web_data

      - name: Render JSON-LD into web/public/
        run: |
          uv run python -m scripts.render_jsonld
          mkdir -p web/public
          cp dist/person.jsonld web/public/person.jsonld

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web deps
        run: pnpm --dir web install --frozen-lockfile

      - name: Build site
        env:
          PUBLIC_GSC_VERIFY: ${{ secrets.GSC_VERIFY }}
          PUBLIC_ANALYTICS_ENABLED: "true"
          PUBLIC_ANALYTICS_ENDPOINT: "https://jinholee.goatcounter.com/count"
        run: pnpm --dir web build

      - name: Smoke-check build outputs
        run: |
          set -euo pipefail
          # Homepages
          test -f web/dist/index.html
          test -f web/dist/de/index.html
          # Project pages — L1 is a representative spot-check; if dynamic routes
          # enumerated 0 projects, all 9 ids would be missing simultaneously.
          test -f web/dist/projects/L1/index.html
          test -f web/dist/de/projects/L1/index.html
          # OG images — homepage + one project page, both langs
          test -f web/dist/og/index-en.png
          test -f web/dist/og/index-de.png
          test -f web/dist/og/projects-L1-en.png
          test -f web/dist/og/projects-L1-de.png
          # OG image size sanity (> 5KB rules out blank/failed renders)
          size=$(stat -c%s web/dist/og/index-en.png 2>/dev/null || stat -f%z web/dist/og/index-en.png)
          [ "$size" -gt 5120 ] || (echo "OG image too small ($size bytes) — generation likely failed" && exit 1)
          # OG meta wired into pages
          grep -q 'property="og:image"' web/dist/index.html
          grep -q 'property="og:image"' web/dist/projects/L1/index.html
          # Phase 6: SEO + analytics outputs
          # Sitemap + robots.txt exist
          test -f web/dist/sitemap-index.xml
          test -f web/dist/sitemap-0.xml
          test -f web/dist/robots.txt
          # Sitemap URL count (2 homepages + 10 projects × 2 langs = 22)
          # grep -c counts matching lines; the sitemap is minified to one line,
          # so we use -o | wc -l to count occurrences instead.
          urls=$(grep -o "<url>" web/dist/sitemap-0.xml | wc -l | tr -d ' ')
          [ "$urls" -eq 22 ] || (echo "sitemap URL count: expected 22, got $urls" && exit 1)
          # robots.txt references the sitemap
          grep -q "sitemap-index.xml" web/dist/robots.txt
          # Analytics snippet doesn't depend on a repo secret — the flag and
          # endpoint are hardcoded in the env block above, so this is active.
          grep -q 'goatcounter' web/dist/index.html || (echo "Missing GoatCounter snippet — check PUBLIC_ANALYTICS_ENABLED env" && exit 1)
          # GSC verification tag — GSC_VERIFY secret must be set.
          grep -q 'google-site-verification' web/dist/index.html || (echo "Missing GSC tag — set GSC_VERIFY repo secret" && exit 1)
          # Phase 8c: target switcher reached the built HTML, both langs
          grep -q 'data-cv-switcher' web/dist/index.html || (echo "Target switcher missing in EN homepage" && exit 1)
          grep -q 'data-cv-switcher' web/dist/de/index.html || (echo "Target switcher missing in DE homepage" && exit 1)
          for page in web/dist/index.html web/dist/de/index.html; do
            for field in headline tagline lead second; do
              grep -q "data-cv-field=\"$field\"" "$page" || (echo "Missing data-cv-field=$field hook in $page" && exit 1)
            done
          done
          # Variant text inlined for client-side swapping (EN + DE)
          grep -q 'Computational Biology · Cancer Genomics' web/dist/index.html || (echo "comp-bio variant text not inlined (EN)" && exit 1)
          grep -q 'Computational Biology · Krebsgenomik' web/dist/de/index.html || (echo "comp-bio variant text not inlined (DE)" && exit 1)
          # Bridge stays SEO-canonical: variant strings must NOT leak into <head>.
          # Split on </head> (robust to Astro's minified, multi-element lines) and
          # fail if any variant string appears in the head segment.
          python3 -c "import sys; head=open('web/dist/index.html',encoding='utf-8').read().split('</head>',1)[0]; sys.exit('Variant positioning leaked into <head> — canonical must stay bridge' if 'Computational Biology' in head else 0)"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
