name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate content
        run: uv run python -m scripts.validate

      - name: Check for PII leaks
        run: uv run python -m scripts.check_pii --tree

      - name: Run tests
        run: uv run pytest -v --tb=short

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  build-pdf:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, de]
        target: [bridge, comp-bio, ds-ml]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Read pinned Typst version
        id: typst-version
        run: echo "version=$(cat .typstversion)" >> "$GITHUB_OUTPUT"

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      - name: Install IBM Plex Sans font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ibm-plex
          fc-cache -f

      - name: Build ${{ matrix.lang }} / ${{ matrix.target }} PDF
        run: uv run python -m pdf.build --lang ${{ matrix.lang }} --target ${{ matrix.target }}

      - name: Compute artifact filename
        id: pdf
        run: |
          if [ "${{ matrix.target }}" = "bridge" ]; then
            echo "file=cv-${{ matrix.lang }}.pdf" >> "$GITHUB_OUTPUT"
          else
            echo "file=cv-${{ matrix.lang }}-${{ matrix.target }}.pdf" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-${{ matrix.lang }}-${{ matrix.target }}-pdf
          path: dist/${{ steps.pdf.outputs.file }}
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 1 }}
          if-no-files-found: error

  build-formats:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Build machine formats
        run: |
          uv run python -m scripts.render_jsonresume
          uv run python -m scripts.render_jsonld
          uv run python -m scripts.render_text --lang en
          uv run python -m scripts.render_text --lang de

      - name: Upload formats artifact
        uses: actions/upload-artifact@v7
        with:
          name: cv-formats
          path: |
            dist/resume.json
            dist/person.jsonld
            dist/cv-en.txt
            dist/cv-de.txt
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 1 }}
          if-no-files-found: error

  ats-guard:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Read pinned Typst version
        id: typst-version
        run: echo "version=$(cat .typstversion)" >> "$GITHUB_OUTPUT"

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      - name: Install IBM Plex Sans font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-ibm-plex
          fc-cache -f

      - name: Install pdftotext (poppler)
        run: sudo apt-get install -y poppler-utils

      - name: Run ATS text-layer guard
        run: uv run pytest tests/test_ats_pdf.py -v

  web-guard:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      # MASTER_CV_DIR points at the committed *synthetic* master-cv.example/ overlay
      # (never the real, gitignored master-cv/) so test_static_facts.py's deep-tier
      # guard is a real assertion, not a tautology: if these renderers ever start
      # honouring the overlay, the example's sentinel strings land in content.*.json
      # -> index.html and the guard goes red. It is a no-op today - the pipeline
      # doesn't read this var at all - which is exactly the property being proven.
      - name: Render web JSON
        env:
          MASTER_CV_DIR: ${{ github.workspace }}/master-cv.example
        run: uv run python -m scripts.render_web_data

      - name: Render JSON-LD into web/public/
        env:
          MASTER_CV_DIR: ${{ github.workspace }}/master-cv.example
        run: |
          uv run python -m scripts.render_jsonld
          mkdir -p web/public
          cp dist/person.jsonld web/public/person.jsonld

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web deps
        run: pnpm --dir web install --frozen-lockfile

      - name: Build site
        run: pnpm --dir web build

      - name: Assert the build actually produced index pages
        run: |
          test -f web/dist/index.html
          test -f web/dist/de/index.html

      - name: Run static-HTML facts + FAQPage guards
        run: uv run pytest tests/test_static_facts.py tests/test_faq_jsonld.py tests/test_writeup_static.py tests/test_build_writeup_static.py -v

  # The digital-twin Worker's vitest suite + typecheck (#118). Deliberately has no
  # `needs: validate`: the worker suite is fully self-contained (vitest stubs the
  # chat-context.md import; no Python involved), so it starts in parallel and a
  # content-YAML error can never mask a worker result. vitest transpiles via esbuild
  # WITHOUT typechecking, so tsc --noEmit runs first - it is the only typecheck the
  # worker gets anywhere.
  worker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker deps
        run: npm --prefix worker ci

      - name: Typecheck the worker
        run: npm --prefix worker run typecheck

      - name: Run worker tests
        run: npm --prefix worker test

  # The web widget's vitest suite (#120): pure-TS unit tests for the twin chat's
  # markdown renderer, including the hostile-payload XSS cases. Like worker-test
  # it deliberately has no `needs: validate` - the suite is self-contained (no
  # Python, no generated content JSON), so it runs in parallel and a content
  # error can never mask a renderer result.
  web-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install web deps
        run: pnpm --dir web install --frozen-lockfile

      - name: Run web tests
        run: pnpm --dir web test

  release:
    needs: [build-pdf, build-formats, ats-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all PDF artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Compute release metadata
        id: meta
        run: |
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cv-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.short_sha }}
          name: CV ${{ steps.meta.outputs.date }}
          files: |
            dist/cv-en.pdf
            dist/cv-de.pdf
            dist/cv-en-comp-bio.pdf
            dist/cv-de-comp-bio.pdf
            dist/cv-en-ds-ml.pdf
            dist/cv-de-ds-ml.pdf
            dist/resume.json
            dist/person.jsonld
            dist/cv-en.txt
            dist/cv-de.txt
          make_latest: true
          body: |
            Auto-generated CV release from commit ${{ github.sha }}.

            Commit: ${{ github.event.head_commit.message }}

            View commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
