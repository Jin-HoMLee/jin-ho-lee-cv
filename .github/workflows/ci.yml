name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Validate content
        run: uv run python -m scripts.validate

      - name: Run tests
        run: uv run pytest -v --tb=short

      - name: Lint
        run: uv run ruff check .

  build-pdf:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Read pinned Typst version
        id: typst-version
        run: echo "version=$(cat .typstversion)" >> "$GITHUB_OUTPUT"

      - name: Install Typst
        uses: typst-community/setup-typst@v3
        with:
          typst-version: ${{ steps.typst-version.outputs.version }}

      - name: Build EN PDF
        run: uv run python -m pdf.build --lang en

      - name: Upload PR preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cv-en-pdf
          path: dist/cv-en.pdf
          retention-days: 30
          if-no-files-found: error
